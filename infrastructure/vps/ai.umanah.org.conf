# ai.umanah.org -> nginx (this VPS) -> Tailscale -> ai-node-01:8130 (Umanah web, which proxies /api to the API).
# Own file; touches no other site. Names are prefixed "ai_" so they cannot collide with existing maps/zones/upstreams.
map $http_upgrade $ai_connection_upgrade { default upgrade; '' ''; }
limit_req_zone $binary_remote_addr zone=ai_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ai_tutor:10m rate=20r/m;      # ~20 tutor messages a minute per visitor (docs/46)

upstream ai_node {
    server 100.127.44.118:8130 max_fails=2 fail_timeout=5s;          # ai-node-01 over Tailscale — never a public address
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.umanah.org;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.umanah.org;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ai.umanah.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.umanah.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ai_ssl:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 256k;

    # The public host never exposes these (docs/41, 46): Safety Alerts, API docs, schema.
    location ^~ /api/safety/  { return 404; }
    location = /api/docs      { return 404; }
    location = /api/openapi.json { return 404; }

    # Tutor replies stream: no buffering, long read timeout, WebSocket/upgrade headers kept.
    location = /api/ai/chat {
        limit_req zone=ai_tutor burst=10 nodelay;
        proxy_pass http://ai_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 = @resting_json;
    }

    location / {
        limit_req zone=ai_general burst=60 nodelay;
        proxy_pass http://ai_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 = @resting;           # ai-node-01 unreachable or the stack is stopped
    }

    location @resting {
        root /var/www/ai-resting;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 120 always;
        default_type text/html;
    }
    location @resting_json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"unavailable","message":"The Umanah AI Lab demo is resting. Check back soon."}}';
    }
}
