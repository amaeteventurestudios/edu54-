# Step 1 of 2 (HTTP only): lets certbot prove control of ai.umanah.org. Replaced by ai.umanah.org.conf once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name ai.umanah.org;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 302 https://$host$request_uri; }
}
