name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: services/api
      - run: uv run pytest -q
        working-directory: services/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: npm ci && npm run typecheck && npm run build
        working-directory: apps/web
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - run: uv sync --frozen
        working-directory: services/api
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
  # The tutor evals (safety, jailbreak, accuracy) need the local models, so they run on the appliance:
  #   cd services/api && uv run python -m evals.run     (results are release gates: docs/41, docs/42)
