# Install: sudo install -D -m0644 docker-after-tailscale.conf /etc/systemd/system/docker.service.d/10-after-tailscale.conf && sudo systemctl daemon-reload
# Docker must not start containers bound to 100.127.44.118 before tailscale0 has that address.
[Unit]
After=tailscaled.service network-online.target
Wants=tailscaled.service network-online.target

[Service]
# ($$ because systemd would otherwise expand $VARS itself.)
# Wait up to 60 s for the Tailscale address; never block boot longer than that.
ExecStartPre=/bin/sh -c 'for i in $$(seq 1 60); do ip -4 addr show tailscale0 2>/dev/null | grep -q "inet 100\\." && exit 0; sleep 1; done; exit 0'
